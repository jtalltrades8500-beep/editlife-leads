<!DOCTYPE html>
<html>
<head>
    <title>SWLA Leads</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 20px; }
        .pricing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .card { border: 1px solid #ddd; padding: 30px; border-radius: 8px; text-align: center; }
        .price { font-size: 36px; font-weight: bold; color: #27ae60; margin: 20px 0; }
        .btn { background: #3498db; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #2980b9; }
        @media (max-width: 768px) { .pricing { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>SWLA Lead Generation</h1>
        <p>Hot permit-based leads for contractors in Southwest Louisiana. Spray foam, roofing, HVAC.</p>
        <p>Month-to-month. 30-day guarantee. Cancel anytime.</p>
        
        <h2>Pricing</h2>
        <div class="pricing">
            <div class="card">
                <h3>Starter</h3>
                <p>40-60 leads/month</p>
                <div class="price">$199</div>
                <button class="btn">Start Free Trial</button>
            </div>
            <div class="card">
                <h3>Growth</h3>
                <p>120-200 leads/month</p>
                <div class="price">$399</div>
                <button class="btn">Start Free Trial</button>
            </div>
            <div class="card">
                <h3>Pro</h3>
                <p>400+ leads/month</p>
                <div class="price">$649</div>
                <button class="btn">Start Free Trial</button>
            </div>
        </div>
    </div>
</body>
</html>
